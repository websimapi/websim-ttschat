<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat Room</title>
    <style>
        :root {
            --background-primary: #36393f;
            --background-secondary: #2f3136;
            --background-tertiary: #202225;
            --header-primary: #ffffff;
            --header-secondary: #b9bbbe;
            --text-normal: #dcddde;
            --text-muted: #72767d;
            --brand-experiment: #5865f2;
            --brand-experiment-hover: #4e5adf;
            --yellow: #ffd700;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--background-primary);
            margin: 0;
            padding: 0;
            height: 100vh;
            color: var(--text-normal);
            display: flex;
            overflow: hidden;
        }

        /* App Layout */
        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 72px;
            background: var(--background-tertiary);
            flex-shrink: 0;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .sidebar-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--background-secondary);
            color: var(--header-secondary);
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-button:hover {
            border-radius: 16px;
            background: var(--brand-experiment);
            color: white;
        }

        .sidebar-button.active {
            border-radius: 16px;
            background: var(--brand-experiment);
            color: white;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            height: 100vh;
        }

        .tab-content {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* Chat Tab Styles */
        .chat-log-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column-reverse;
        }
        
        #messages-wrapper {
            display: flex;
            flex-direction: column;
        }

        .load-more-btn {
            display: block;
            margin: 20px auto 0 auto;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: var(--background-secondary);
            color: var(--text-normal);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .load-more-btn:hover {
            background-color: #40444b;
        }


        .chat-input-area {
            flex-shrink: 0;
            padding: 10px 20px 20px 20px;
            background-color: var(--background-primary);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .input-controls-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        #tts-text {
            flex-grow: 1;
            width: 100%;
            min-height: 68px;
            max-height: 200px;
            border-radius: 8px;
            border: none;
            background: var(--background-secondary);
            padding: 12px;
            color: var(--text-normal);
            font-size: 1rem;
            resize: none;
            margin: 0;
            line-height: 1.4;
        }

        .right-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 220px;
            flex-shrink: 0;
        }

        #tts-text::placeholder {
            color: var(--text-muted);
        }

        .voice-selector-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .voice-dropdown-container {
            flex: 1;
            position: relative;
        }
        .voice-dropdown-label {
            display: none;
        }

        #voice-dropdown {
            width: 100%;
            padding: 10px 12px 10px 40px; /* Make space for button */
            border-radius: 5px;
            border: 1px solid var(--background-tertiary);
            background: var(--background-secondary);
            color: var(--text-normal);
            font-size: 0.9rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        #voice-dropdown option {
            background: var(--background-secondary);
            color: var(--text-normal);
        }

        #random-voice-btn, #send-chat-btn {
            background: var(--brand-experiment);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #random-voice-btn {
            font-size: 1.2rem;
            padding: 0;
            width: 44px;
            height: 44px;
            line-height: 44px;
        }
        #random-voice-btn:hover, #send-chat-btn:hover {
            background: var(--brand-experiment-hover);
        }
        #send-chat-btn {
            font-size: 1rem;
            width: 100%;
            margin: 0;
            height: 44px;
            flex-shrink: 0;
            margin: 0;
        }

        #preview-play-btn {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--brand-experiment);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0;
            color: white;
            font-size: 1rem;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 2;
        }
        #preview-play-btn:hover {
            background: var(--brand-experiment-hover);
        }
        #preview-play-btn.playing {
            background: #43b581;
        }


        /* Chat Message Styles */
        .chat-message {
            display: flex;
            padding: 10px 0;
            transition: background-color 0.2s;
            border-radius: 5px;
        }
        .chat-message:hover {
            background-color: rgba(255,255,255,0.02);
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .chat-content {
            flex-grow: 1;
        }
        .chat-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
        }
        .username {
            font-weight: bold;
            color: var(--header-primary);
            font-size: 1rem;
        }
        .timestamp {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .chat-text {
            color: var(--text-normal);
            line-height: 1.5;
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .chat-audio {
            width: 100%;
            max-width: 400px;
            height: 40px;
        }
        .voice-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }


        /* Voice Collection Tab */
        #voices-tab {
            background-color: var(--background-primary);
            padding: 20px;
            overflow: hidden;
        }
        .voices-header {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .voices-header h2 {
            color: var(--header-primary);
            margin: 0 0 20px 0;
        }

        .control-button {
            background: var(--background-secondary);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            color: var(--text-normal);
            cursor: pointer;
            margin: 0 10px;
            transition: background-color 0.2s ease;
        }
        .control-button:hover {
            background-color: #40444b;
        }
        
        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding: 5px 20px 5px 5px; 
        }
        .voice-card {
            background: var(--background-secondary);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--background-tertiary);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .voice-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .voice-card.selected {
            border-color: var(--yellow);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .voice-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--yellow);
        }
        .voice-script {
            font-style: italic;
            margin-bottom: 15px;
            line-height: 1.5;
            opacity: 0.9;
            flex-grow: 1;
        }
        .card-buttons {
            display: flex;
            gap: 10px;
        }
        .play-button, .use-tts-button {
            border: none;
            border-radius: 5px;
            padding: 10px 0;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-size: 0.9rem;
        }
        .play-button { background: #f04747; }
        .play-button:hover { background: #d84040; }
        .use-tts-button { background: var(--brand-experiment); }
        .use-tts-button:hover { background: var(--brand-experiment-hover); }
        .playing { background: #43b581 !important; }
        
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar">

                        <button id="send-chat-btn">Send</button>

                </div>

            <!-- Voices Tab -->
            <div id="voices-tab" class="tab-content">

                    <h2>🎭 Voice Collection</h2>

                </div>
                <div class="voices-grid" id="voicesGrid">

    </div>

        const room = new WebsimSocket();

        let currentAudio = null;
        let currentButton = null;
        let selectedVoiceForTTS = null;
        let uploadedVoiceUrls = {}; 
        let previewAudio = null;

        const audioQueue = [];
        let isAudioPlaying = false;

        let lastMessageIds = new Set();

        function switchTab(tabName, button) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.sidebar-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            button.classList.add('active');
        }

        function autoGrowTextarea(element) {
            element.style.height = 'auto'; // Reset height
            element.style.height = (element.scrollHeight) + 'px';
        }

        function populateVoiceDropdown() {
            const dropdown = document.getElementById('voice-dropdown');
            voices.sort((a,b) => a.title.localeCompare(b.title)).forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = voice.title;
                dropdown.appendChild(option);
            });
        }
        
        function getVoiceIndexByTitle(title) {
            return voices.findIndex(v => v.title === title);
        }

        function selectVoiceFromDropdown() {
            const dropdown = document.getElementById('voice-dropdown');
            const selectedIndex = dropdown.value;
            
            if (selectedIndex === '') {
                hideVoicePreview();
                selectedVoiceForTTS = null;
                return;
            }
            
            selectVoiceForTTS(parseInt(selectedIndex));
        }

        function selectRandomVoice() {
            const randomIndex = Math.floor(Math.random() * voices.length);
            document.getElementById('voice-dropdown').value = randomIndex;
            selectVoiceForTTS(randomIndex);
            // Close dropdown if on mobile after selection
            document.getElementById('voice-dropdown').blur();
        }

        function selectVoiceForTTS(index) {
            const voice = voices[index];
            selectedVoiceForTTS = { file: voice.file, title: voice.title, script: voice.script };

            if (previewAudio) {
                previewAudio.pause();
                previewAudio = null;
            }
            const playBtn = document.getElementById('preview-play-btn');
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
            
            showVoicePreview();
        }

        function showVoicePreview() {
            document.getElementById('preview-play-btn').style.display = 'block';
        }

        function hideVoicePreview() {
            const playBtn = document.getElementById('preview-play-btn');
            playBtn.style.display = 'none';
            if (previewAudio) {
                previewAudio.pause();
                previewAudio = null;
            }
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
        }

        function playPreview() {
            if (!selectedVoiceForTTS) return;
            
            const button = document.getElementById('preview-play-btn');

            if (previewAudio && !previewAudio.paused) {
                previewAudio.pause();
                return; // onpause event will handle button state
            }

            // If different audio or no audio, create new
            if (!previewAudio || previewAudio.src !== new URL(selectedVoiceForTTS.file, window.location.href).href) {
                 previewAudio = new Audio(selectedVoiceForTTS.file);
                 previewAudio.onended = function() {
                    button.textContent = '▶';
                    button.classList.remove('playing');
                };
                 previewAudio.onpause = function() {
                    button.textContent = '▶';
                    button.classList.remove('playing');
                 };
            }

            previewAudio.play();
            button.textContent = '⏸️';
            button.classList.add('playing');
        }

        async function uploadAudioFile(filename) {
            if (uploadedVoiceUrls[filename]) return uploadedVoiceUrls[filename];
            try {
                const response = await fetch(filename);
                const blob = await response.blob();
                const file = new File([blob], filename, { type: blob.type });
                const url = await websim.upload(file);
                uploadedVoiceUrls[filename] = url;
                return url;
            } catch (error) {
                console.error('Error uploading audio file:', error);
                throw error;
            }
        }

        function createVoiceCard(voice, index) {
            return `

                    <div class="card-buttons">
                        <button class="play-button" onclick="playVoice('${voice.file}', this)">▶ Play</button>
                        <button class="use-tts-button" onclick="selectForTTSFromCard(${index})">🎙️ Use for TTS</button>
                    </div>
                </div>
            `;
        }

        function playVoice(filename, button) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';

                currentAudio = null;
                currentButton = null;
                return;
            }

            currentAudio = new Audio(filename);
            currentButton = button;
            button.classList.add('playing');
            button.innerHTML = '⏸️ Playing...';
            currentAudio.play();
            currentAudio.onended = function() {
                button.classList.remove('playing');
                button.innerHTML = '▶ Play';
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';
                }
                currentAudio = null;
                currentButton = null;
            }
        }

        function playRandomFromCollection() {
            stopAll();
            const randomIndex = Math.floor(Math.random() * voices.length);
            const buttons = document.querySelectorAll('#voicesGrid .play-button');
            playVoice(voices[randomIndex].file, buttons[randomIndex]);
        }

        function selectForTTSFromCard(index) {
            const voice = voices[index];
            const dropdownIndex = getVoiceIndexByTitle(voice.title);
            switchTab('chat', document.querySelector('.sidebar-button[onclick*="\'chat\'"]'));
            document.getElementById('voice-dropdown').value = dropdownIndex;
            selectVoiceForTTS(dropdownIndex);
            document.querySelectorAll('.voice-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`voice-card-${index}`).classList.add('selected');
        }

        async function sendChatMessage() {
            const text = document.getElementById('tts-text').value.trim();
            const generateBtn = document.getElementById('send-chat-btn');

            if (!selectedVoiceForTTS) {
                alert('Please select a voice first.');
                return;
            }
            if (!text) {
                return; // Don't alert for empty message, just don't send
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<div class="spinner"></div>';

            try {
                const voiceUrl = await uploadAudioFile(selectedVoiceForTTS.file);
                const result = await websim.textToSpeech({ text: text, voice_sample: voiceUrl });

                addToQueue(result.url);
                
                const myPeer = room.peers[room.clientId];
                const messageId = `${Date.now()}-${room.clientId}`;
                const newMessage = {
                    id: messageId,
                    text: text,
                    voice_type: selectedVoiceForTTS.title,
                    audio_url: result.url,
                    clientId: room.clientId,
                    username: myPeer.username,
                    avatarUrl: myPeer.avatarUrl,
                    createdAt: Date.now()
                };

                room.updateRoomState({
                    messages: { [messageId]: newMessage }
                });
                
                document.getElementById('tts-text').value = '';

            } catch (error) {
                console.error('TTS Generation Error:', error);
                alert('Sorry, there was an error sending the message. Please try again.');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = 'Send';
            }
        }

        function playNextInQueue() {
            if (isAudioPlaying || audioQueue.length === 0) return;

            isAudioPlaying = true;
            const audioUrl = audioQueue.shift();
            
            if (!queueAudioPlayer) {
                queueAudioPlayer = new Audio();
                queueAudioPlayer.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    playNextInQueue();
                });
                queueAudioPlayer.addEventListener('error', (e) => {
                    console.error("Error playing audio from queue:", e);
                    isAudioPlaying = false;
                    playNextInQueue();
                });
            }
            
            queueAudioPlayer.src = audioUrl;
            queueAudioPlayer.play().catch(e => {
                console.error("Playback failed:", e);
                isAudioPlaying = false;
                playNextInQueue();
            });
        }

        function addToQueue(url) {
            audioQueue.push(url);
            playNextInQueue();
        }

        function renderChatLog() {
            const container = document.getElementById('chatLogContainer');
            const wrapper = document.getElementById('messages-wrapper');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            // With column-reverse, "bottom" is scrollTop 0.
            const isScrolledToBottom = container.scrollTop < 5;
            const oldScrollHeight = container.scrollHeight;

            const messagesToRender = allMessages.slice(-displayedMessageCount);

            if (messagesToRender.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No messages yet. Be the first to say something!</p>';
            } else {
                 wrapper.innerHTML = messagesToRender.map(msg => {
                    const peer = room.peers[msg.clientId] || { username: msg.username, avatarUrl: msg.avatarUrl };
                    return `
                    <div class="chat-message" data-message-id="${msg.id}">
                        <img src="${peer.avatarUrl}" alt="${peer.username}" class="user-avatar">
                        <div class="chat-content">
                            <div class="chat-header">
                                <span class="username">${peer.username}</span>
                                <span class="timestamp">${new Date(msg.createdAt).toLocaleString()}</span>
                            </div>
                             <p class="chat-text">${msg.text}</p>
                             <div class="voice-type">(${msg.voice_type})</div>
                             <audio controls class="chat-audio" src="${msg.audio_url}"></audio>
                        </div>
                    </div>
                `}).join('');
            }
           
            if (allMessages.length > displayedMessageCount) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }

            if (isScrolledToBottom) {
                container.scrollTop = 0;
            } else if (container.scrollHeight > oldScrollHeight) {
                // Keep scroll position when loading more messages at the top
                 container.scrollTop += (container.scrollHeight - oldScrollHeight);
            }
        }
        
        function handleLoadMore() {
            displayedMessageCount += PAGE_SIZE;
            renderChatLog();
        }

        async function main() {
            await room.initialize();
            
            const ttsTextarea = document.getElementById('tts-text');
            ttsTextarea.addEventListener('input', () => autoGrowTextarea(ttsTextarea));
            
            document.getElementById('send-chat-btn').addEventListener('click', sendChatMessage);
            ttsTextarea.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendChatMessage();
                }
            });
            document.getElementById('load-more-btn').addEventListener('click', handleLoadMore);

            populateVoiceDropdown();
            document.getElementById('voicesGrid').innerHTML = voices.map(createVoiceCard).join('');
            
            // Initial render
            const initialMessages = room.roomState.messages || {};
            lastMessageIds = new Set(Object.keys(initialMessages));
            allMessages = Object.values(initialMessages).sort((a, b) => a.createdAt - b.createdAt);
            renderChatLog();
            document.getElementById('chatLogContainer').scrollTop = 0;


            room.subscribeRoomState(() => {
                const messages = room.roomState.messages || {};
                const currentMessageIds = new Set(Object.keys(messages));
                let newMessagesExist = false;

                for (const id of currentMessageIds) {
                    if (!lastMessageIds.has(id)) {
                        newMessagesExist = true;
                        const newMessage = messages[id];
                        if (newMessage.clientId !== room.clientId) {
                            addToQueue(newMessage.audio_url);
                        }
                    }
                }
                lastMessageIds = currentMessageIds;

                allMessages = Object.values(messages).sort((a, b) => a.createdAt - b.createdAt);
                renderChatLog();
            });
        }

        main();
    </script>
