<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Voice Chat Room</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scroll */
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h1, h2 {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        /* Tab Navigation Styles */
        .tab-navigation {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 5px;
            backdrop-filter: blur(10px);
        }

        .tab-button {
            flex: 1;
            max-width: 200px;
            padding: 15px 20px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tab-button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        /* Tab Content Styles */
        .tab-content {
            display: none;
            flex-grow: 1;
            flex-direction: column;
            overflow: hidden; /* Prevent content from spilling */
        }

        .tab-content.active {
            display: flex;
        }

        /* TTS/Chat Tab Styles */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden; /* Contain children */
        }

        .chat-controls-container {
            padding-top: 20px;
            background: linear-gradient(to top, rgba(118, 75, 162, 1) 0%, rgba(102, 126, 234, 0) 100%);
            flex-shrink: 0; /* Prevent this container from shrinking */
        }

        .voice-selector-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .voice-dropdown-container {
            flex: 1;
        }

        .voice-dropdown-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffd700;
        }

        #voice-dropdown {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        #voice-dropdown option {
            background: #4a5568;
            color: white;
        }

        #random-voice-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        #random-voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .selected-voice-preview {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .preview-title {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .preview-script {
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .preview-controls {
            display: flex;
            gap: 10px;
        }

        .preview-play-btn {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .preview-play-btn:hover {
            transform: scale(1.05);
        }
        
        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
            flex-grow: 1;
            overflow-y: auto;
            padding: 5px; /* Add some padding for scrollbar */
        }
        
        .voice-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .voice-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        
        .voice-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .voice-script {
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.6;
            opacity: 0.9;
            flex-grow: 1;
        }
        
        .card-buttons {
            display: flex;
            gap: 10px;
        }

        .play-button, .use-tts-button {
            border: none;
            border-radius: 25px;
            padding: 12px 0;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
        }

        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);

        }

            transform: scale(0.98);
        }

            background: linear-gradient(45deg, #2ecc71, #27ae60) !important;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            margin: 0 10px;

            font-size: 1rem;
        }
        
        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #tts-text {

            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            color: white;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 20px;
        }

        #tts-text::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #send-chat-btn {

            overflow-y: auto;
            padding-right: 15px; /* for scrollbar */

        .chat-message {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);

            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;

            height: 40px;
            border-radius: 50%;

        }

        .chat-info {
            flex-grow: 1;
        }

        .username {
            font-weight: bold;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .voice-type {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .timestamp {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;

        .chat-text {
            font-style: italic;
            margin-bottom: 15px;
            line-height: 1.5;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            border-left: 3px solid #ffd700;
        }

        .chat-audio {
            width: 100%;
            height: 40px;
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Actor Voice Chat Room</h1>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-button active" onclick="switchTab('chat')">💬 Chat Room</button>

                    <textarea id="tts-text" placeholder="Select a voice, type a message, and press Enter to send..."></textarea>
                    <div style="text-align: center;">
                        <button id="send-chat-btn" class="control-button">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Voices Tab -->
        <div id="voices-tab" class="tab-content">
            <h2>🎭 Voice Collection</h2>

        const room = new WebsimSocket();

        let currentAudio = null;
        let currentButton = null;
        let selectedVoiceForTTS = null;
        let uploadedVoiceUrls = {}; // Cache for uploaded URLs
        let previewAudio = null;

        // Audio queue for chat messages
        const audioQueue = [];
        let isAudioPlaying = false;
        let queueAudioPlayer;

        // Tab switching functionality
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        // Populate voice dropdown
        function populateVoiceDropdown() {
            const dropdown = document.getElementById('voice-dropdown');
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = voice.title;
                dropdown.appendChild(option);
            });
        }

        // Select voice from dropdown
        function selectVoiceFromDropdown() {
            const dropdown = document.getElementById('voice-dropdown');
            const selectedIndex = dropdown.value;
            
            if (selectedIndex === '') {
                hideVoicePreview();
                if (previewAudio) {
                    previewAudio.pause();
                    previewAudio = null;
                }
                document.getElementById('preview-play-btn').textContent = '▶ Preview';
                return;
            }
            
            selectVoiceForTTS(parseInt(selectedIndex));
        }

        function selectRandomVoice() {
            const randomIndex = Math.floor(Math.random() * voices.length);
            document.getElementById('voice-dropdown').value = randomIndex;
            selectVoiceForTTS(randomIndex);
        }

        function selectVoiceForTTS(index) {
            const voice = voices[index];
            selectedVoiceForTTS = { file: voice.file, title: voice.title, script: voice.script };

            if (previewAudio) {
                previewAudio.pause();
                previewAudio = null;
            }
            document.getElementById('preview-play-btn').textContent = '▶ Preview';
            
            showVoicePreview(voice);
        }

        function showVoicePreview(voice) {
            const preview = document.getElementById('selected-voice-preview');
            document.getElementById('preview-title').textContent = voice.title;
            preview.style.display = 'block';
        }

        function hideVoicePreview() {
            document.getElementById('selected-voice-preview').style.display = 'none';
            selectedVoiceForTTS = null;
        }

        function playPreview() {
            if (!selectedVoiceForTTS) return;
            
            const button = document.getElementById('preview-play-btn');

            if (!previewAudio) {
                previewAudio = new Audio(selectedVoiceForTTS.file);
                previewAudio.onended = function() {
                    button.textContent = '▶ Preview';
                    button.classList.remove('playing');
                };
            }

            if (previewAudio.paused) {
                previewAudio.play();
                button.textContent = '⏸️ Pause';
                button.classList.add('playing');
            } else {
                previewAudio.pause();
                button.textContent = '▶ Preview';
                button.classList.remove('playing');
            }
        }

        async function uploadAudioFile(filename) {
            if (uploadedVoiceUrls[filename]) {
                return uploadedVoiceUrls[filename];
            }
            try {
                const response = await fetch(filename);
                const blob = await response.blob();
                const file = new File([blob], filename, { type: blob.type });
                const url = await websim.upload(file);
                uploadedVoiceUrls[filename] = url;
                return url;
            } catch (error) {
                console.error('Error uploading audio file:', error);
                throw error;
            }
        }

                    <div class="card-buttons">
                        <button class="play-button" onclick="playVoice('${voice.file}', this)">
                            ▶ Play
                        </button>
                        <button class="use-tts-button" onclick="selectForTTSFromCard(${index})">
                            🎙️ Use for TTS
                        </button>
                    </div>
                </div>
            `;
        }

                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';
                }
            }

            if (currentButton === button) {
                currentAudio = null;
                currentButton = null;
                return;
            }

            currentAudio = new Audio(filename);
            currentButton = button;
            button.classList.add('playing');
            button.innerHTML = '⏸️ Playing...';
            currentAudio.play();
            currentAudio.onended = function() {
                button.classList.remove('playing');
                button.innerHTML = '▶ Play';
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';
                }
                currentAudio = null;
                currentButton = null;
            }
        }

        function playRandomFromCollection() {
            stopAll();
            const randomIndex = Math.floor(Math.random() * voices.length);
            const buttons = document.querySelectorAll('.play-button');
            playVoice(voices[randomIndex].file, buttons[randomIndex]);
        }

        function selectForTTSFromCard(index) {
            switchTab('chat');
            document.getElementById('voice-dropdown').value = index;
            selectVoiceForTTS(index);
            document.querySelectorAll('.voice-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`voice-card-${index}`).classList.add('selected');
        }

        async function sendChatMessage() {
            const text = document.getElementById('tts-text').value.trim();
            const generateBtn = document.getElementById('send-chat-btn');

            if (!selectedVoiceForTTS) {
                alert('Please select a voice first.');
                return;
            }
            if (!text) {
                alert('Please enter a message.');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = 'Sending... <div class="spinner"></div>';

            try {
                const voiceUrl = await uploadAudioFile(selectedVoiceForTTS.file);
                const result = await websim.textToSpeech({
                    text: text,
                    voice_sample: voiceUrl
                });

                // Add to own queue
                addToQueue(result.url);
                
                // Broadcast for others to play
                room.send({
                    type: 'chat_message',
                    audio_url: result.url,
                    echo: false // Don't send back to self
                });

                // Save to persistent collection, which triggers UI update for everyone
                await room.collection('generated_voice').create({
                    text: text,
                    voice_type: selectedVoiceForTTS.title,
                    audio_url: result.url,
                    voice_sample_file: selectedVoiceForTTS.file
                });
                
                document.getElementById('tts-text').value = '';

            } catch (error) {
                console.error('TTS Generation Error:', error);
                alert('Sorry, there was an error sending the message. Please try again.');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = 'Send';
            }
        }

        function playNextInQueue() {
            if (isAudioPlaying || audioQueue.length === 0) {
                return;
            }
            isAudioPlaying = true;
            const audioUrl = audioQueue.shift();
            
            if (!queueAudioPlayer) {
                queueAudioPlayer = new Audio();
                queueAudioPlayer.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    playNextInQueue();
                });
                queueAudioPlayer.addEventListener('error', (e) => {
                    console.error("Error playing audio from queue:", e);
                    isAudioPlaying = false;
                    playNextInQueue();
                });
            }
            
            queueAudioPlayer.src = audioUrl;
            queueAudioPlayer.play().catch(e => {
                console.error("Playback failed:", e);
                isAudioPlaying = false;
                playNextInQueue();
            });
        }

        function addToQueue(url) {
            audioQueue.push(url);
            playNextInQueue();
        }

        function renderChatLog(voices) {
            const container = document.getElementById('chatLogContainer');
            if (voices.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7;">No messages yet. Be the first to say something!</p>';
                return;
            }

            container.innerHTML = voices.slice().reverse().map(voice => `
                <div class="chat-message">
                    <div class="chat-header">
                        <img src="https://images.websim.com/avatar/${voice.username}" alt="${voice.username}" class="user-avatar">
                        <div class="chat-info">
                            <div class="username">@${voice.username}</div>
                            <div class="voice-type">${voice.voice_type}</div>
                            <div class="timestamp">${new Date(voice.created_at).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="chat-text">"${voice.text}"</div>
                    <audio controls class="chat-audio">
                        <source src="${voice.audio_url}" type="audio/wav">
                    </audio>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function main() {
            await room.initialize();
            
            // Event Listeners
            document.getElementById('send-chat-btn').addEventListener('click', sendChatMessage);
            document.getElementById('tts-text').addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendChatMessage();
                }
            });

            // Initialize the page
            populateVoiceDropdown();
            document.getElementById('voicesGrid').innerHTML = voices.map(createVoiceCard).join('');
            
            // Handle incoming realtime messages
            room.onmessage = (event) => {
                const data = event.data;
                if (data.type === 'chat_message' && data.audio_url) {
                    addToQueue(data.audio_url);
                }
            };
            
            // Subscribe to gallery updates for the visual chat log
            room.collection('generated_voice').subscribe(renderChatLog);
        }

        main();
    </script>
